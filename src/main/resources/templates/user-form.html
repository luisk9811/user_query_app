<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar Usuario</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<div class="container">
    <h2>Buscar Usuario</h2>
    <form action="/find-user-by-id/search" method="post">
        <label for="id">ID de Usuario:</label>
        <input type="number" id="id" name="id" required>
        <button type="submit">Buscar</button>
    </form>

    <div th:if="${user}" class="result">
        <p><strong>Nombre:</strong> <span th:text="${user.firstName}"></span></p>
        <p><strong>Apellido:</strong> <span th:text="${user.lastName}"></span></p>
    </div>

    <div th:if="${error}" class="error">
        <p th:text="${error}"></p>
    </div>
</div>
</body>
</html>
